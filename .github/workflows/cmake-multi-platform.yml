# CMake build matrix: Windows (MSVC) and Linux (GCC), shared library only.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # 固定 Ubuntu 24.04：避免 runner 镜像漂移导致 Qt/系统库组合变化；
        # 改动 os 标签时必须同步 include 与所有 if: matrix.os == 条件。
        os: [windows-latest, ubuntu-24.04]
        build_type: [Release]
        # 发布形态是动态库，CI 只跑 ON；静态库组合留给本地构建覆盖。
        # 裁剪后 job 数 = 2(os) x 1(build_type) x 1(build_shared) = 2。
        build_shared: [ON]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            qt_version: 5.15.2
            qt_host: windows
            qt_arch: win64_msvc2019_64
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            qt_version: 5.14.2
            qt_host: linux
            qt_arch: gcc_64

    env:
      # Reads the private CPM dependencies below. Needs Contents: Read on each of them;
      # a fine-grained token must also be approved by the owning organization.
      XSTYPES_PAT: ${{ secrets.XSTYPES_PAT }}
      PRIVATE_DEPS: FOHEART/CarbonUI FOHEART/MotionGloveLLSDK FOHEART/GloveSteamDriver
      QT_CACHE_DIR: ${{ github.workspace }}/.qt
      BUILD_DIR: ${{ github.workspace }}/build

    steps:
    # 官方 Action 统一使用 node24 主版本，避免 "Node.js 20 is deprecated" 警告；
    # jurplel/install-qt-action@v4 是 composite，内部已用 setup-python v6。
    - uses: actions/checkout@v6
      with:
        # Keep the workflow GITHUB_TOKEN out of .git/config. Its http.extraheader takes
        # precedence over the XSTYPES_PAT credentials set below, which makes every
        # private dependency clone fail with "Repository not found" (HTTP 404).
        persist-credentials: false

    - name: Configure git auth for private dependencies
      shell: bash
      run: |
        if [ -z "${XSTYPES_PAT}" ]; then
          echo "::error::Repository secret XSTYPES_PAT is not set."
          exit 1
        fi
        # A fine-grained token authenticates as its owner's login, not as x-access-token.
        body=$(curl -sS -H "Authorization: Bearer ${XSTYPES_PAT}" \
          -H "Accept: application/vnd.github+json" https://api.github.com/user || true)
        user=$(echo "${body}" | grep -o '"login": *"[^"]*"' | head -n 1 | sed 's/.*: *"//; s/"$//' || true)
        if [ -z "${user}" ]; then
          echo "::error::XSTYPES_PAT was rejected by api.github.com (invalid, expired or revoked)."
          exit 1
        fi
        echo "XSTYPES_PAT belongs to ${user}"
        git config --global url."https://${user}:${XSTYPES_PAT}@github.com/".insteadOf "https://github.com/"
        git config --global credential.interactive never
        git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
        echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

    - name: Verify access to private dependencies
      shell: bash
      run: |
        for repo in ${PRIVATE_DEPS}; do
          if err=$(git ls-remote --heads "https://github.com/${repo}.git" 2>&1 >/dev/null); then
            echo "OK   ${repo}"
          else
            echo "::error::Cannot read ${repo}"
            echo "${err}" | sed 's/^/       /'
            echo "       Fine-grained token: repository selected, Contents: Read, approved by the org."
            echo "       Classic token: 'repo' scope and organization membership."
            exit 1
          fi
        done

    - name: Setup Python (Windows only)
      if: matrix.os == 'windows-latest'
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Restore Qt cache
      id: qt-cache
      uses: actions/cache@v6
      with:
        path: ${{ env.QT_CACHE_DIR }}
        key: ${{ runner.os }}-qt-${{ matrix.qt_version }}-${{ matrix.qt_arch }}
        restore-keys: |
          ${{ runner.os }}-qt-${{ matrix.qt_version }}-

    - name: Install Qt ${{ matrix.qt_version }}
      if: steps.qt-cache.outputs.cache-hit != 'true'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt_version }}
        host: ${{ matrix.qt_host }}
        target: desktop
        arch: ${{ matrix.qt_arch }}
        dir: ${{ env.QT_CACHE_DIR }}
        setup-python: false
        install-deps: true

    - name: Install system dependencies (Ubuntu only)
      if: matrix.os == 'ubuntu-24.04'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ninja-build libgl1-mesa-dev mesa-common-dev qtmultimedia5-dev \
          libxkbcommon-x11-0 libx11-xcb1 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
          libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

    - name: Locate Qt5 CMake package
      shell: bash
      run: |
        for root in "${QT_CACHE_DIR}" /usr/lib; do
          [ -d "${root}" ] || continue
          cfg=$(find "${root}" -name Qt5Config.cmake -print -quit 2>/dev/null || true)
          if [ -n "${cfg}" ]; then break; fi
        done
        if [ -z "${cfg}" ]; then
          echo "::error::Qt5Config.cmake not found under ${QT_CACHE_DIR} or /usr/lib"
          exit 1
        fi
        echo "Found ${cfg}"
        # Three levels up is the Qt install prefix (<prefix>/lib/cmake/Qt5), which is what
        # CMAKE_PREFIX_PATH expects.
        qt_cmake_dir=$(dirname "${cfg}")
        qt_prefix=$(cd "${qt_cmake_dir}/../../.." && pwd)
        if [ "${RUNNER_OS}" = "Windows" ]; then
          qt_cmake_dir=$(cygpath -w "${qt_cmake_dir}")
          qt_prefix=$(cygpath -w "${qt_prefix}")
        fi
        echo "Qt5_DIR=${qt_cmake_dir}" >> "$GITHUB_ENV"
        echo "CMAKE_PREFIX_PATH=${qt_prefix}" >> "$GITHUB_ENV"
        # A cache hit skips the install step, so its PATH entry has to be recreated here:
        # Qt DLLs must be findable when ctest discovers and runs the test executables.
        echo "${qt_prefix}/bin" >> "$GITHUB_PATH"

    - name: Configure CMake
      shell: bash
      run: |
        # Qt5_DIR from bash is an MSYS path and is unusable by cmake.exe on Windows.
        if [ "${{ runner.os }}" = "Linux" ]; then
          QT_ARGS="-DQt5_DIR=${Qt5_DIR} -DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}"
        fi
        cmake -B "${BUILD_DIR}" \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DMOTIONGLOVE_UI_BUILD_SHARED=${{ matrix.build_shared }} \
          ${QT_ARGS} \
          -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build "${{ env.BUILD_DIR }}" --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ env.BUILD_DIR }}
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure