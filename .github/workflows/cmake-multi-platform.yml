# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        #build_shared: [ON, OFF]
        c_compiler: [gcc,  cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl


    # Provide the private-repo token via repository secret named XSTYPES_PAT
    env:
      XSTYPES_PAT: ${{ secrets.XSTYPES_PAT }}

    steps:
    - uses: actions/checkout@v4
  
    - name: Configure git auth (unix)
      if: runner.os != 'Windows'
      run: |
        printf "machine github.com\nlogin %s\npassword %s\n" "${{ github.actor }}" "${{ secrets.XSTYPES_PAT }}" > "${HOME}/.netrc"
        chmod 600 "${HOME}/.netrc"

    - name: Configure git auth (windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $netrc = "machine github.com`nlogin $env:GITHUB_ACTOR`npassword $env:XSTYPES_PAT`n"
        $netrc | Out-File -FilePath "$env:USERPROFILE\.netrc" -Encoding ascii
        icacls "$env:USERPROFILE\.netrc" /inheritance:r /grant:r "${env:USERNAME}:R"

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Setup Python (Windows only)
      if: matrix.os == 'windows-latest'
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set Qt cache dir (Windows only)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        echo "QT_CACHE_DIR=${{ github.workspace }}\\.qt" >> "$GITHUB_ENV"
        echo "QT_VERSION=5.15.2" >> "$GITHUB_ENV"
        echo "QT_ARCH=win64_msvc2019_64" >> "$GITHUB_ENV"

    - name: Set Qt cache dir (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        echo "QT_CACHE_DIR=${{ github.workspace }}/.qt" >> "$GITHUB_ENV"
        echo "QT_VERSION=5.14.2" >> "$GITHUB_ENV"
        echo "QT_ARCH=gcc_64" >> "$GITHUB_ENV"

    - name: Restore Qt cache (Windows only)
      if: matrix.os == 'windows-latest'
      id: qt-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.QT_CACHE_DIR }}
        key: ${{ runner.os }}-qt-5.15.2-win64_msvc2019_64
        restore-keys: |
          ${{ runner.os }}-qt-5.15.2-

    - name: Restore Qt cache (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      id: qt-cache-ubuntu
      uses: actions/cache@v4
      with:
        path: ${{ env.QT_CACHE_DIR }}
        key: ${{ runner.os }}-qt-5.14.2-gcc_64
        restore-keys: |
          ${{ runner.os }}-qt-5.14.2-

    - name: Install system dependencies (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgl1-mesa-dev \
          mesa-common-dev \
          libxkbcommon-x11-0 \
          libx11-xcb1 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-sync1 \
          libxcb-xfixes0 \
          libxcb-xinerama0 \
          libxcb-xkb1

    - name: Install Qt 5.15.2 (Windows only)
      if: matrix.os == 'windows-latest' && steps.qt-cache.outputs.cache-hit != 'true'
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        arch: 'win64_msvc2019_64'
        dir: ${{ env.QT_CACHE_DIR }}
        setup-python: false
        install-deps: true

    - name: Detect Qt CMake package (Windows only)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        echo "Searching for Qt5Config.cmake under: ${QT_CACHE_DIR}"
        QT5_CONFIG=$(find "${QT_CACHE_DIR}" -type f -name Qt5Config.cmake -print -quit)
        if [ -z "${QT5_CONFIG}" ]; then
          echo "Qt5Config.cmake not found in cache dir"
          find "${QT_CACHE_DIR}" -maxdepth 6 -type d -print || true
          exit 1
        fi
        QT5_CMAKE_DIR=$(dirname "${QT5_CONFIG}")
        QT_PREFIX=$(cd "${QT5_CMAKE_DIR}/../.." && pwd)
        echo "Found Qt5Config.cmake: ${QT5_CONFIG}"
        echo "Qt5_DIR=${QT5_CMAKE_DIR}" >> "$GITHUB_ENV"
        echo "CMAKE_PREFIX_PATH=${QT_PREFIX}" >> "$GITHUB_ENV"
        echo "arch=${QT_ARCH}" >> "$GITHUB_ENV"

    - name: Verify Qt CMake package (Windows only)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        echo "QT_CACHE_DIR=${QT_CACHE_DIR}"
        echo "Qt5_DIR=${Qt5_DIR}"
        echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}"
        test -f "${Qt5_DIR}/Qt5Config.cmake"

    - name: Install Qt 5.14.2 (Ubuntu only)
      if: matrix.os == 'ubuntu-latest' && steps.qt-cache-ubuntu.outputs.cache-hit != 'true'
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.14.2'
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        dir: ${{ env.QT_CACHE_DIR }}
        setup-python: false
        install-deps: true

    - name: Detect Qt CMake package (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        echo "Env dump (Qt-related):"
        env | sort | grep -E '^(Qt|QT|CMAKE_PREFIX_PATH)'

        SEARCH_ROOTS=()
        [ -n "${QT_CACHE_DIR}" ] && SEARCH_ROOTS+=("${QT_CACHE_DIR}")
        [ -n "${Qt5_DIR}" ] && SEARCH_ROOTS+=("${Qt5_DIR}")
        [ -n "${Qt5_ROOT}" ] && SEARCH_ROOTS+=("${Qt5_ROOT}")
        [ -n "${QT_ROOT_DIR}" ] && SEARCH_ROOTS+=("${QT_ROOT_DIR}")
        [ -n "${RUNNER_TEMP}" ] && SEARCH_ROOTS+=("${RUNNER_TEMP}")
        SEARCH_ROOTS+=("${HOME}" "${GITHUB_WORKSPACE}" "/opt")

        echo "Search roots: ${SEARCH_ROOTS[*]}"

        QT5_CONFIG=""
        for root in "${SEARCH_ROOTS[@]}"; do
          if [ -d "${root}" ]; then
            echo "Searching for Qt5Config.cmake under: ${root}"
            QT5_CONFIG=$(find "${root}" -type f -name Qt5Config.cmake -print -quit 2>/dev/null || true)
            if [ -n "${QT5_CONFIG}" ]; then
              break
            fi
          fi
        done

        if [ -z "${QT5_CONFIG}" ]; then
          echo "Qt5Config.cmake not found in any search root"
          echo "Listing QT_CACHE_DIR (${QT_CACHE_DIR}) top-level:"
          ls -la "${QT_CACHE_DIR}" || true
          exit 1
        fi

        QT5_CMAKE_DIR=$(dirname "${QT5_CONFIG}")
        QT_PREFIX=$(cd "${QT5_CMAKE_DIR}/../.." && pwd)
        echo "Found Qt5Config.cmake: ${QT5_CONFIG}"
        echo "Qt5_DIR=${QT5_CMAKE_DIR}" >> "$GITHUB_ENV"
        echo "CMAKE_PREFIX_PATH=${QT_PREFIX}" >> "$GITHUB_ENV"

    - name: Verify Qt CMake package (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        echo "Qt5_DIR=${Qt5_DIR}"
        echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}"
        test -f "${Qt5_DIR}/Qt5Config.cmake"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        #-DBUILDCARBONUI_SHARED=${{ matrix.build_shared }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}

